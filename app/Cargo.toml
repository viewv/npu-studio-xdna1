[package]
name = "npu-studio"
version = "0.1.0"
edition = "2021"
description = "NPU Studio — 背景虚化虚拟摄像头的图形前端 (Slint)"
license = "GPL-3.0-or-later"

[dependencies]
slint = "1.18"
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memmap2 = "0.9"
libc = "0.2"

[build-dependencies]
slint-build = "1.18"

[profile.release]
lto = "thin"
strip = true
